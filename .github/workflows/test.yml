name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pdfplumber pytest
      - run: python -m pytest -q
        working-directory: extractor

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        working-directory: worker
      - run: npx tsc --noEmit && npx tsc --noEmit -p test/tsconfig.json
        working-directory: worker
      - run: npx vitest run
        working-directory: worker
